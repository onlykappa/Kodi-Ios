        run: |
          python3 -B scripts/build_import_review.py --foundation-report reports/ios-foundation-addon-audit.json --output "$RUNNER_TEMP/kodi-import-review"
      - name: Apply full bundle twice and restore clean synthetic profile
        run: |
          python3 -B scripts/smoke_import_bundle.py --bundle "$RUNNER_TEMP/kodi-import-review/Kodi-iOS-Customized-Import.zip" --report "$RUNNER_TEMP/kodi-import-review/full-import-smoke.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kodi-ios-customized-import-review
          path: ${{ runner.temp }}/kodi-import-review/*
          if-no-files-found: error
          retention-days: 7
      - name: Acquire isolated official foundation for customized IPA
        if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'build-ipa')
        run: |
          mkdir -p "$RUNNER_TEMP/customized-foundation"
          deb=org.xbmc.kodi-ios_21.3_iphoneos-arm64.deb
          fetch() { curl --fail --location --proto '=https' --proto-redir '=https' --max-time 120 --output "$RUNNER_TEMP/customized-foundation/foundation.deb" "$1"; }
          want=c80e2e4eded0b3be9f9c8cd19a73e3f3ac7171575dd6f08cfddf14312ca81eb8
          # Kodi's mirror first; if it fails, the kept copy in release third-party-sources-1 (accepted only if it has the same pinned digest).
          if ! { fetch "https://mirrors.kodi.tv/releases/darwin/ios-arm64/$deb" && printf '%s  %s\n' "$want" "$RUNNER_TEMP/customized-foundation/foundation.deb" | sha256sum --check; }; then
            echo "Kodi's mirror failed or differed; trying the kept copy"
            fetch "https://github.com/${{ github.repository }}/releases/download/third-party-sources-1/$deb"
          fi
          printf '%s  %s\n' "$want" "$RUNNER_TEMP/customized-foundation/foundation.deb" | sha256sum --check
          mkdir -p "$KODI_IOS_PRESERVE_DIR" && cp "$RUNNER_TEMP/customized-foundation/foundation.deb" "$KODI_IOS_PRESERVE_DIR/$deb"
          dpkg-deb --extract "$RUNNER_TEMP/customized-foundation/foundation.deb" "$RUNNER_TEMP/customized-foundation/unpacked"
      - name: Acquire pinned portrait pieces (rotation-aware Kodi executable, Liquid Glass tab bar)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'build-ipa')
        run: python3 -B scripts/ios_portrait.py --fetch "$RUNNER_TEMP/portrait-inputs"
      - name: Acquire pinned Elementum client, iPhoneOS engine framework and kodi-six
        if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'build-ipa')
        run: python3 -B scripts/fetch_elementum_inputs.py --output "$RUNNER_TEMP/elementum-inputs"
      - name: Build and validate full customized unsigned ARM64 IPA
        if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'build-ipa')
        env:
          KODI_IOS_PYTHON311: ${{ steps.py311.outputs.python-path }}
        run: |
          # The bundle was just rebuilt from pinned, hash-checked sources; pin the IPA to that exact bundle.
          bundle_sha=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['sha256'])" "$RUNNER_TEMP/kodi-import-review/import-review-report.json")
          python3 -B scripts/build_customized_ipa.py --app "$RUNNER_TEMP/customized-foundation/unpacked/Applications/Kodi.app" --deb "$RUNNER_TEMP/customized-foundation/foundation.deb" --bundle "$RUNNER_TEMP/kodi-import-review/Kodi-iOS-Customized-Import.zip" --expected-sha256 "$bundle_sha" --work "$RUNNER_TEMP/customized-app" --output "$RUNNER_TEMP/customized-ipa" --elementum "$RUNNER_TEMP/elementum-inputs" --portrait-inputs "$RUNNER_TEMP/portrait-inputs" --providers "$RUNNER_TEMP/provider-inputs"
      # The owner installs the raw .ipa: publish it as a prerelease asset instead of a zipped artifact.
      - name: Publish raw IPA as a prerelease download
        if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'build-ipa')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN: ${{ github.run_number }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          ipa=$(ls "$RUNNER_TEMP"/customized-ipa/*.ipa)
          name=$(basename "$ipa" .ipa)
          # ISSUE-332: if the tag cannot be made on this commit (HTTP 403), it is made on the default branch; the pin is the asset's sha256.
          gh release create "build-$RUN" "$ipa" --repo "$REPO" --target "$SHA" --prerelease --title "$name (build $RUN)" --notes "Unsigned iPhone test build of $SHA. Install the .ipa with your sideloader as an update." ||
          gh release create "build-$RUN" "$ipa" --repo "$REPO" --target "$DEFAULT" --prerelease --title "$name (build $RUN)" --notes "Unsigned iPhone test build of $SHA. Install the .ipa with your sideloader as an update."
          # Preserve existing test releases; publishing a build must not delete earlier test artifacts.
      # 2026-11-24 (ISSUE-470): POV's upstream repository began answering 404 and stopped a build. Every pinned third-party source, as this run downloaded and verified it, is
      # kept as a release of this repository; provider_addons.py falls back to it (digest checked) when an upstream address fails.
      - name: Keep a copy of every pinned third-party source (release provider-sources-1)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          python3 -B scripts/preserve_provider_sources.py --inputs "$RUNNER_TEMP/provider-inputs" --output "$RUNNER_TEMP/provider-sources"
          tag=provider-sources-1
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP"/provider-sources/* --clobber --repo "$REPO"
          else
            gh release create "$tag" "$RUNNER_TEMP"/provider-sources/* --repo "$REPO" --target "$DEFAULT" --prerelease --title "Pinned third-party sources" --notes "Copies of the archives pinned in migration/provider-fallback/source-lock.json, each checked against its sha256. Used only when the upstream address fails."
          fi
      # 2026-11-24: the same for every other third-party download (official Kodi add-on archives, jurialmunkey's, Elementum client and Burst, CocoScrapers, kodi-six modules, the Kodi 21.3 package).
      - name: Keep a copy of every third-party download (release third-party-sources-1)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          tag=third-party-sources-1
          ls -la "$KODI_IOS_PRESERVE_DIR"
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            gh release download "$tag" --repo "$REPO" --pattern MANIFEST.json --dir "$RUNNER_TEMP/earlier" || true
            python3 -B scripts/source_mirror.py --directory "$KODI_IOS_PRESERVE_DIR" --previous "$RUNNER_TEMP/earlier/MANIFEST.json"
            gh release upload "$tag" "$KODI_IOS_PRESERVE_DIR"/* --clobber --repo "$REPO"
          else
            python3 -B scripts/source_mirror.py --directory "$KODI_IOS_PRESERVE_DIR"
            gh release create "$tag" "$KODI_IOS_PRESERVE_DIR"/* --repo "$REPO" --target "$DEFAULT" --prerelease --title "Third-party sources (kept copies)" --notes "Copies of every third-party file a build downloads, each already checked against the pin in this repository's lock files. MANIFEST.json lists each file's sha256. Used only when an upstream address fails (scripts/source_mirror.py)."
          fi
