      - 'migration/import-overlays/**'
      - 'migration/ios/**'
      - 'docs/iphone-import.md'
  # Owner (2026-11-13): "i just want one new build with everything not 1000". Every push runs the tests and the review
  # bundle; the IPA (foundation, portrait pieces, Elementum, build, prerelease) is built only when asked for: Run workflow
  # (workflow_dispatch) on the branch, or the "build-ipa" label on the pull request.
  workflow_dispatch:
permissions:
  contents: read
# A requested IPA build (Run workflow) has its own group, so a later push's test run never cancels it.
concurrency:
  group: kodi-customized-import-review-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: true
      # Every verified third-party download of this run is copied here (scripts/source_mirror.py) and published as release third-party-sources-1 at the end.
      - name: Folder for the kept third-party copies
        run: echo "KODI_IOS_PRESERVE_DIR=$RUNNER_TEMP/third-party-sources" >> "$GITHUB_ENV"
      # The phone runs CPython 3.11: the bundle's .pyc files must come from the same version (build_customized_ipa.precompile).
      - name: Python 3.11 for the bundle bytecode
        id: py311
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          update-environment: false
      - name: Acquire pinned provider fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/provider_addons.py --output "$RUNNER_TEMP/provider-inputs"
      - name: Test staged import and navigation safety
        env:
          KODI_IOS_PYTHON311: ${{ steps.py311.outputs.python-path }}
          KODI_PROVIDER_INPUTS: ${{ runner.temp }}/provider-inputs
          PROVIDER_FIXTURES: ${{ runner.temp }}/provider-inputs
          KODI_REQUIRE_PROVIDER_FIXTURES: '1'
