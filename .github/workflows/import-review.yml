name: Customized import review bundle
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/import-review.yml'
      - 'scripts/build_import_review.py'
      - 'scripts/build_customized_ipa.py'
      - 'scripts/fetch_elementum_inputs.py'
      - 'migration/elementum-ios/source-lock.json'
      - 'migration/airplay-ios/source-lock.json'
      - 'migration/glassbar-ios/source-lock.json'
      - 'migration/ios-portrait/source-lock.json'
      - 'scripts/test_customized_ipa.py'
      - 'scripts/test_bundled_bootstrap.py'
      - 'scripts/test_ios_navigation.py'
      - 'scripts/test_native_startup.py'
      - 'scripts/test_native_ui.py'
      - 'scripts/test_search_categories.py'
      - 'scripts/test_updates_calibration.py'
      - 'scripts/test_drive_upload.py'
      - 'scripts/test_settings_search.py'
      - 'scripts/test_deck_picker.py'
      - 'scripts/test_source_match.py'
      - 'migration/deck-picker/**'
      - 'scripts/test_startup_sequence.py'
      - 'migration/bundled-bootstrap/**'
      - 'scripts/import_runtime/**'
      - 'scripts/import_profile.py'
      - 'scripts/smoke_import_bundle.py'
      - 'scripts/test_import_profile.py'
      - 'scripts/test_watch_routes.py'
      - 'scripts/test_watch_dialog.py'
      - 'scripts/test_watch_continue.py'
      - 'scripts/test_continue_downloads.py'
      - 'scripts/test_drive_library.py'
      - 'scripts/test_listing_cache.py'
      - 'scripts/test_activation.py'
      - 'migration/import-inputs/**'
      - 'migration/import-overlays/**'
      - 'migration/ios/**'
      - 'docs/iphone-import.md'
  # Since the merge to main (DEC-024) builds run on pushes to main; pull requests still build too.
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-review.yml'
      - 'scripts/build_import_review.py'
      - 'scripts/build_customized_ipa.py'
      - 'scripts/fetch_elementum_inputs.py'
      - 'migration/elementum-ios/source-lock.json'
      - 'migration/airplay-ios/source-lock.json'
      - 'migration/glassbar-ios/source-lock.json'
      - 'migration/ios-portrait/source-lock.json'
      - 'scripts/test_customized_ipa.py'
      - 'scripts/test_bundled_bootstrap.py'
      - 'scripts/test_ios_navigation.py'
      - 'scripts/test_native_startup.py'
      - 'scripts/test_native_ui.py'
      - 'scripts/test_search_categories.py'
      - 'scripts/test_updates_calibration.py'
      - 'scripts/test_drive_upload.py'
      - 'scripts/test_settings_search.py'
      - 'scripts/test_deck_picker.py'
      - 'scripts/test_source_match.py'
      - 'migration/deck-picker/**'
      - 'scripts/test_startup_sequence.py'
      - 'migration/bundled-bootstrap/**'
      - 'scripts/import_runtime/**'
      - 'scripts/import_profile.py'
      - 'scripts/smoke_import_bundle.py'
      - 'scripts/test_import_profile.py'
      - 'scripts/test_watch_routes.py'
      - 'scripts/test_watch_dialog.py'
      - 'scripts/test_watch_continue.py'
      - 'scripts/test_continue_downloads.py'
      - 'scripts/test_drive_library.py'
      - 'scripts/test_listing_cache.py'
      - 'scripts/test_activation.py'
      - 'migration/import-inputs/**'
      - 'migration/import-overlays/**'
      - 'migration/ios/**'
      - 'docs/iphone-import.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kodi-customized-import-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # The phone runs CPython 3.11: the bundle's .pyc files must come from the same version (build_customized_ipa.precompile).
      - name: Python 3.11 for the bundle bytecode
        id: py311
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          update-environment: false
      - name: Test staged import and navigation safety
        env:
          KODI_IOS_PYTHON311: ${{ steps.py311.outputs.python-path }}
        run: |
          python3 -B scripts/test_startup_sequence.py
          python3 -B scripts/test_ios_navigation.py
          python3 -B scripts/test_native_startup.py
          python3 -B scripts/test_native_ui.py
          python3 -B scripts/test_updates_calibration.py
          python3 -B scripts/test_drive_upload.py
          python3 -B scripts/test_settings_search.py
          python3 -B scripts/test_deck_picker.py
          python3 -B scripts/test_source_match.py
          python3 -B scripts/test_bundled_bootstrap.py
          python3 -B scripts/test_portrait.py
          python3 -B scripts/test_glassbar.py
          python3 -B scripts/test_seek_release.py
          python3 -B scripts/test_notices.py
          python3 -B scripts/test_notice_log.py
          python3 -B scripts/test_pages.py
          python3 -B scripts/test_airplay_remux.py
          python3 -B scripts/test_airplay_flow.py
          python3 -B scripts/test_airplay_room.py
          python3 -B scripts/test_play_on_tv_start.py
          python3 -B scripts/test_play_on_tv_network.py
          python3 -B scripts/test_prepare_downloads.py
          python3 -B scripts/test_debrid_drive.py
          python3 -B scripts/test_elementum_cloud.py
          python3 -B scripts/test_drive_prepare.py
          python3 -B scripts/test_preparation_runtime.py
          python3 -B scripts/test_transfer_artwork.py
          python3 -B scripts/test_diagnostics.py
          python3 -B scripts/test_library_status.py
          python3 -B scripts/test_downloaded_play.py
          python3 -B scripts/test_choose_source.py
          python3 -B scripts/test_signin_server.py
          python3 -B scripts/test_library_scan.py
          python3 -B scripts/test_library_refresh.py
          python3 -B scripts/test_library_artwork.py
          python3 -B scripts/test_library_pages.py
          python3 -B scripts/test_downloaded_show.py
          python3 -B scripts/test_show_scrolling.py
          python3 -B scripts/test_show_parent_navigation.py
          python3 -B scripts/test_settings_page.py
          python3 -B scripts/test_genre_photos.py
          python3 -B scripts/test_search_categories.py
          python3 -B scripts/test_performance_budget.py
          python3 -B scripts/test_customized_ipa.py
          python3 -B scripts/test_import_builder.py
          python3 -B scripts/test_import_profile.py
          python3 -B scripts/test_watch_routes.py
          python3 -B scripts/test_watch_dialog.py
          python3 -B scripts/test_watch_continue.py
          python3 -B scripts/test_continue_downloads.py
          python3 -B scripts/test_drive_library.py
          python3 -B scripts/test_listing_cache.py
          python3 -B scripts/test_activation.py
          python3 -B scripts/test_ios.py
      - name: Acquire public pinned sources and build review ZIP
        run: |
          python3 -B scripts/build_import_review.py --foundation-report reports/ios-foundation-addon-audit.json --output "$RUNNER_TEMP/kodi-import-review"
      - name: Apply full bundle twice and restore clean synthetic profile
        run: |
          python3 -B scripts/smoke_import_bundle.py --bundle "$RUNNER_TEMP/kodi-import-review/Kodi-iOS-Customized-Import.zip" --report "$RUNNER_TEMP/kodi-import-review/full-import-smoke.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kodi-ios-customized-import-review
          path: ${{ runner.temp }}/kodi-import-review/*
          if-no-files-found: error
          retention-days: 7
      - name: Acquire isolated official foundation for customized IPA
        run: |
          mkdir -p "$RUNNER_TEMP/customized-foundation"
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 120 --output "$RUNNER_TEMP/customized-foundation/foundation.deb" https://mirrors.kodi.tv/releases/darwin/ios-arm64/org.xbmc.kodi-ios_21.3_iphoneos-arm64.deb
          printf '%s  %s\n' c80e2e4eded0b3be9f9c8cd19a73e3f3ac7171575dd6f08cfddf14312ca81eb8 "$RUNNER_TEMP/customized-foundation/foundation.deb" | sha256sum --check
          dpkg-deb --extract "$RUNNER_TEMP/customized-foundation/foundation.deb" "$RUNNER_TEMP/customized-foundation/unpacked"
      - name: Acquire pinned portrait pieces (rotation-aware Kodi executable, Liquid Glass tab bar)
        run: python3 -B scripts/ios_portrait.py --fetch "$RUNNER_TEMP/portrait-inputs"
      - name: Acquire pinned Elementum client, iPhoneOS engine framework and kodi-six
        run: python3 -B scripts/fetch_elementum_inputs.py --output "$RUNNER_TEMP/elementum-inputs"
      - name: Build and validate full customized unsigned ARM64 IPA
        env:
          KODI_IOS_PYTHON311: ${{ steps.py311.outputs.python-path }}
        run: |
          # The bundle was just rebuilt from pinned, hash-checked sources; pin the IPA to that exact bundle.
          bundle_sha=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['sha256'])" "$RUNNER_TEMP/kodi-import-review/import-review-report.json")
          python3 -B scripts/build_customized_ipa.py --app "$RUNNER_TEMP/customized-foundation/unpacked/Applications/Kodi.app" --deb "$RUNNER_TEMP/customized-foundation/foundation.deb" --bundle "$RUNNER_TEMP/kodi-import-review/Kodi-iOS-Customized-Import.zip" --expected-sha256 "$bundle_sha" --work "$RUNNER_TEMP/customized-app" --output "$RUNNER_TEMP/customized-ipa" --elementum "$RUNNER_TEMP/elementum-inputs" --portrait-inputs "$RUNNER_TEMP/portrait-inputs"
      # The owner installs the raw .ipa: publish it as a prerelease asset instead of a zipped artifact.
      - name: Publish raw IPA as a prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN: ${{ github.run_number }}
        run: |
          ipa=$(ls "$RUNNER_TEMP"/customized-ipa/*.ipa)
          name=$(basename "$ipa" .ipa)
          gh release create "build-$RUN" "$ipa" --repo "$REPO" --target "$SHA" --prerelease --title "$name (build $RUN)" --notes "Unsigned iPhone test build of $SHA. Install the .ipa with your sideloader as an update."
          # Keep the three newest test builds by publish time (a release's createdAt is its commit date, so a
          # re-run or an older branch would lose to newer commits elsewhere).
          gh release list --repo "$REPO" --limit 100 --json tagName,publishedAt --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.publishedAt) | reverse | .[3:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --repo "$REPO" --cleanup-tag --yes; done
