name: AirPlay MKV remuxer
# Builds and tests the AirPlay remuxer (migration/airplay-ios/remux) and KodiAirPlay.framework r10 with it.
# Builds only: nothing is published here. The framework release (once per tag, sha256 pinned in
# migration/airplay-ios/source-lock.json) stays with airplay-ios.yml.
on:
  push:
    branches: [feature/airplay-mkv-remux]
    paths:
      - '.github/workflows/airplay-remux.yml'
      - 'migration/airplay-ios/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/airplay-remux.yml'
      - 'migration/airplay-ios/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: ffmpeg for the test fixtures (x264, x265, DTS and TrueHD encoders)
        run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/ff-host
          key: remux-ffmpeg-host-${{ hashFiles('migration/airplay-ios/build-remux-ffmpeg.sh', 'migration/airplay-ios/build-dav1d.sh', 'migration/airplay-ios/ffmpeg-mov-pts.patch') }}
      - name: FFmpeg 8.1.1 (remux + picture bridge, LGPL) for the host
        run: |
          [ -f "$RUNNER_TEMP/ff-host/lib/libavformat.a" ] || bash migration/airplay-ios/build-remux-ffmpeg.sh host "$RUNNER_TEMP/ff-host"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/ass-host
          key: remux-libass-host-${{ hashFiles('migration/airplay-ios/build-libass.sh') }}
      - name: libass 0.17.4 + FreeType + FriBidi + HarfBuzz (r10 burned-in subtitles) for the host
        run: |
          [ -f "$RUNNER_TEMP/ass-host/lib/libass.a" ] || bash migration/airplay-ios/build-libass.sh host "$RUNNER_TEMP/ass-host"
      - name: Host tests (fixtures from files and over HTTP with Range)
        run: bash migration/airplay-ios/remux/tests/run_host_tests.sh "$RUNNER_TEMP/ff-host" "$RUNNER_TEMP/remux-tests" "$RUNNER_TEMP/ass-host"
  framework:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/ff-ios
          key: remux-ffmpeg-ios-${{ hashFiles('migration/airplay-ios/build-remux-ffmpeg.sh', 'migration/airplay-ios/build-dav1d.sh', 'migration/airplay-ios/ffmpeg-mov-pts.patch') }}
      - name: FFmpeg 8.1.1 (remux + picture bridge, LGPL) for iPhoneOS
        run: |
          [ -f "$RUNNER_TEMP/ff-ios/lib/libavformat.a" ] || bash migration/airplay-ios/build-remux-ffmpeg.sh ios "$RUNNER_TEMP/ff-ios"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/ass-ios
          key: remux-libass-ios-${{ hashFiles('migration/airplay-ios/build-libass.sh') }}
      - name: libass (r10 burned-in subtitles) for iPhoneOS
        run: |
          [ -f "$RUNNER_TEMP/ass-ios/lib/libass.a" ] || bash migration/airplay-ios/build-libass.sh ios "$RUNNER_TEMP/ass-ios"
      - name: Build KodiAirPlay.framework r10 with the remuxer
        env:
          REMUX_FFMPEG: ${{ runner.temp }}/ff-ios
          REMUX_LIBASS: ${{ runner.temp }}/ass-ios
        run: bash migration/airplay-ios/build-airplay.sh "$RUNNER_TEMP/airplay"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KodiAirPlay-r10-candidate
          path: |
            ${{ runner.temp }}/airplay/KodiAirPlay.framework.zip
            ${{ runner.temp }}/airplay/KodiAirPlay.framework.zip.sha256
