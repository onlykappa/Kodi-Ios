name: AirPlay MKV remuxer
# Builds/tests the current AirPlay source and compiles an iPhoneOS framework candidate.
# Builds only: nothing is published here. The framework release (once per tag, sha256 pinned in
# migration/airplay-ios/source-lock.json) stays with airplay-ios.yml.
on:
  push:
    # Isolated candidate validation: no IPA workflow or framework release runs on this branch.
    branches: [feature/airplay-mkv-remux, validation/airplay-source]
    paths:
      - '.github/workflows/airplay-remux.yml'
      - 'migration/airplay-ios/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/airplay-remux.yml'
      - 'migration/airplay-ios/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # Run 43056244487 hung here twice for 20-35 min (Ubuntu mirror): apt now times out and retries.
      - name: ffmpeg for the test fixtures (x264, x265, DTS and TrueHD encoders)
        timeout-minutes: 12
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for try in 1 2 3; do
            sudo timeout 240 apt-get $APT update -q && sudo timeout 300 apt-get $APT install -yq ffmpeg libx265-dev && exit 0
            echo "apt try $try failed; retrying"; sleep 10
          done
          exit 1
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/ff-host
          key: remux-ffmpeg-hdr-host-${{ hashFiles('migration/airplay-ios/build-remux-ffmpeg.sh', 'migration/airplay-ios/build-dav1d.sh', 'migration/airplay-ios/ffmpeg-mov-pts.patch', 'migration/airplay-ios/ffmpeg-dovi-padding.patch', 'migration/airplay-ios/ffmpeg-mkv-skip-attachments.patch') }}
      - name: FFmpeg 8.1.1 test-only host build with HEVC Main10 reference encoder
        run: |
          [ -f "$RUNNER_TEMP/ff-host/lib/libavformat.a" ] || KR_HDR_TESTS=1 bash migration/airplay-ios/build-remux-ffmpeg.sh host "$RUNNER_TEMP/ff-host"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/ass-host
          key: remux-libass-host-${{ hashFiles('migration/airplay-ios/build-libass.sh') }}
      - name: libass 0.17.4 + FreeType + FriBidi + HarfBuzz (r10 burned-in subtitles) for the host
        run: |
          [ -f "$RUNNER_TEMP/ass-host/lib/libass.a" ] || bash migration/airplay-ios/build-libass.sh host "$RUNNER_TEMP/ass-host"
      - name: Host tests (fixtures from files and over HTTP with Range)
        run: KR_HDR_TESTS=1 bash migration/airplay-ios/remux/tests/run_host_tests.sh "$RUNNER_TEMP/ff-host" "$RUNNER_TEMP/remux-tests" "$RUNNER_TEMP/ass-host"
      # Build 190 (owner: "do a full rundown audit and tests on this conversion"): the real converter and the add-on's
      # queue end to end against a local Drive stand-in: interrupted runs, killed uploads, slow lines, the read-back check.
      - name: End-to-end conversion (converter + add-on queue + Drive stand-in)
        run: |
          sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -yq libass-dev
          FF="$RUNNER_TEMP/ff-host";R=migration/airplay-ios/remux
          cc -std=gnu11 -O2 -fPIC -shared -w -I"$FF/include" "$R"/src/*.c "$R"/gmplayer/*.c -Wl,-Bsymbolic \
            "$FF/lib/libavformat.a" "$FF/lib/libavcodec.a" "$FF/lib/libdav1d.a" "$FF/lib/libswscale.a" "$FF/lib/libswresample.a" "$FF/lib/libavutil.a" \
            -lass -lx265 -lz -lm -lpthread -lstdc++ -ldl -o "$RUNNER_TEMP/libkodiairplay.so"
          python3 -B "$R/tests/e2e_conversion.py" "$RUNNER_TEMP/libkodiairplay.so" "$RUNNER_TEMP/remux-tests/fixtures"
      - name: Retain synthetic fixture and dependency configuration on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AirPlay-host-diagnostics
          path: |
            ${{ runner.temp }}/remux-tests/fixtures/dovi.mkv
            ${{ runner.temp }}/ff-host/FFMPEG-CONFIG.txt
  framework:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/ff-ios
          key: remux-ffmpeg-ios-${{ hashFiles('migration/airplay-ios/build-remux-ffmpeg.sh', 'migration/airplay-ios/build-dav1d.sh', 'migration/airplay-ios/ffmpeg-mov-pts.patch', 'migration/airplay-ios/ffmpeg-dovi-padding.patch', 'migration/airplay-ios/ffmpeg-mkv-skip-attachments.patch') }}
      - name: FFmpeg 8.1.1 (remux + picture bridge, LGPL) for iPhoneOS
        run: |
          [ -f "$RUNNER_TEMP/ff-ios/lib/libavformat.a" ] || bash migration/airplay-ios/build-remux-ffmpeg.sh ios "$RUNNER_TEMP/ff-ios"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/ass-ios
          key: remux-libass-ios-${{ hashFiles('migration/airplay-ios/build-libass.sh') }}
      - name: libass (r10 burned-in subtitles) for iPhoneOS
        run: |
          [ -f "$RUNNER_TEMP/ass-ios/lib/libass.a" ] || bash migration/airplay-ios/build-libass.sh ios "$RUNNER_TEMP/ass-ios"
      - name: Compile KodiAirPlay.framework candidate with the remuxer
        env:
          REMUX_FFMPEG: ${{ runner.temp }}/ff-ios
          REMUX_LIBASS: ${{ runner.temp }}/ass-ios
        run: bash migration/airplay-ios/build-airplay.sh "$RUNNER_TEMP/airplay"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KodiAirPlay-source-candidate
          path: |
            ${{ runner.temp }}/airplay/KodiAirPlay.framework.zip
            ${{ runner.temp }}/airplay/KodiAirPlay.framework.zip.sha256
