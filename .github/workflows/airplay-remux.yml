name: AirPlay MKV remuxer
# Builds/tests the current AirPlay source and compiles an iPhoneOS framework candidate.
# Builds only: nothing is published here. The framework release (once per tag, sha256 pinned in
# migration/airplay-ios/source-lock.json) stays with airplay-ios.yml.
on:
  push:
    # Isolated candidate validation: no IPA workflow or framework release runs on this branch.
    branches: [feature/airplay-mkv-remux, validation/airplay-source]
    paths:
      - '.github/workflows/airplay-remux.yml'
      - 'migration/airplay-ios/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/airplay-remux.yml'
      - 'migration/airplay-ios/**'
  workflow_dispatch:
    inputs:
      inspect_only:
        description: Inspect existing artifact without rebuilding
        type: boolean
        default: false
      reuse_host_run:
        description: Reuse a successful host-tests job only when its complete AirPlay source tree matches
        type: string
        default: ''
permissions:
  contents: read
jobs:
  inspect-existing-candidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Execute production recovery callback with controlled native objects
        run: python3 -B scripts/test_native_airplay_recovery.py
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: KodiAirPlay-source-candidate
          run-id: 44343640378
          github-token: ${{ github.token }}
          path: candidate
      - name: Inspect existing candidate without publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd candidate
          shasum -a 256 KodiAirPlay.framework.zip
          unzip -t KodiAirPlay.framework.zip
          unzip -q KodiAirPlay.framework.zip
          shasum -a 256 KodiAirPlay.framework/KodiAirPlay
          file KodiAirPlay.framework/KodiAirPlay
          xcrun vtool -show-build KodiAirPlay.framework/KodiAirPlay
          nm -gU KodiAirPlay.framework/KodiAirPlay
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          def gh(*args): return subprocess.check_output(['gh','api',*args],text=True)
          run=json.loads(gh('repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/44343640378'))
          assert run['head_sha']=='95bb0d23fd5cb53c3b450e8a839c0b2fab3c611e' and run['conclusion']=='success'
          binary=Path('KodiAirPlay.framework/KodiAirPlay')
          platform=subprocess.check_output(['xcrun','vtool','-show-build',str(binary)],text=True)
          assert 'platform IOS' in platform
          exports=subprocess.check_output(['nm','-gU',str(binary)],text=True)
          required=['prepare','probe','prepare_streams','prepare_to','verify','probe_ex','prepare_hdr','prepare_keep_image_subs','prepare_keep_dvd_subs','start_at','serve','serve_segmented']
          for name in required: assert '_kodi_airplay_'+name in exports
          assert '_kodi_background_state' in exports
          report={'source_commit':run['head_sha'],'candidate_run':run['id'],'archive_sha256':hashlib.sha256(Path('KodiAirPlay.framework.zip').read_bytes()).hexdigest(),'binary_sha256':hashlib.sha256(binary.read_bytes()).hexdigest(),'platform':platform,'required_exports_verified':required,'exports':exports,'device_playback_verified':False}
          payload={'name':'AirPlay candidate inspection report','head_sha':os.environ['GITHUB_SHA'],'status':'completed','conclusion':'success','output':{'title':'Existing candidate verified without publication','summary':json.dumps(report,indent=2)}}
          Path('report.json').write_text(json.dumps(payload))
          gh('repos/'+os.environ['GITHUB_REPOSITORY']+'/check-runs','--method','POST','--input','report.json')
          PY
  host-tests:
    if: inputs.inspect_only != true && (github.event_name != 'workflow_dispatch' || inputs.reuse_host_run == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # Run 43056244487 hung here twice for 20-35 min (Ubuntu mirror): apt now times out and retries.
      - name: ffmpeg for the test fixtures (x264, x265, DTS and TrueHD encoders)
        timeout-minutes: 12
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for try in 1 2 3; do
            sudo timeout 240 apt-get $APT update -q && sudo timeout 300 apt-get $APT install -yq ffmpeg libx265-dev && exit 0
            echo "apt try $try failed; retrying"; sleep 10
          done
          exit 1
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/ff-host
          key: remux-ffmpeg-hdr-host-${{ hashFiles('migration/airplay-ios/build-remux-ffmpeg.sh', 'migration/airplay-ios/build-dav1d.sh', 'migration/airplay-ios/ffmpeg-mov-pts.patch', 'migration/airplay-ios/ffmpeg-dovi-padding.patch', 'migration/airplay-ios/ffmpeg-mkv-skip-attachments.patch') }}
      - name: FFmpeg 8.1.1 test-only host build with HEVC Main10 reference encoder
        run: |
          [ -f "$RUNNER_TEMP/ff-host/lib/libavformat.a" ] || KR_HDR_TESTS=1 bash migration/airplay-ios/build-remux-ffmpeg.sh host "$RUNNER_TEMP/ff-host"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/ass-host
          key: remux-libass-host-${{ hashFiles('migration/airplay-ios/build-libass.sh') }}
      - name: libass 0.17.4 + FreeType + FriBidi + HarfBuzz (r10 burned-in subtitles) for the host
        run: |
          [ -f "$RUNNER_TEMP/ass-host/lib/libass.a" ] || bash migration/airplay-ios/build-libass.sh host "$RUNNER_TEMP/ass-host"
      - name: Host tests (fixtures from files and over HTTP with Range)
        run: KR_HDR_TESTS=1 bash migration/airplay-ios/remux/tests/run_host_tests.sh "$RUNNER_TEMP/ff-host" "$RUNNER_TEMP/remux-tests" "$RUNNER_TEMP/ass-host"
      # Build 190 (owner: "do a full rundown audit and tests on this conversion"): the real converter and the add-on's
      # queue end to end against a local Drive stand-in: interrupted runs, killed uploads, slow lines, the read-back check.
      - name: End-to-end conversion (converter + add-on queue + Drive stand-in)
        run: |
          sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -yq libass-dev
          FF="$RUNNER_TEMP/ff-host";R=migration/airplay-ios/remux
          cc -std=gnu11 -O2 -fPIC -shared -w -I"$FF/include" "$R"/src/*.c "$R"/gmplayer/*.c -Wl,-Bsymbolic \
            "$FF/lib/libavformat.a" "$FF/lib/libavcodec.a" "$FF/lib/libdav1d.a" "$FF/lib/libswscale.a" "$FF/lib/libswresample.a" "$FF/lib/libavutil.a" \
            -lass -lx265 -lz -lm -lpthread -lstdc++ -ldl -o "$RUNNER_TEMP/libkodiairplay.so"
          python3 -B "$R/tests/e2e_conversion.py" "$RUNNER_TEMP/libkodiairplay.so" "$RUNNER_TEMP/remux-tests/fixtures"
          python3 -B "$R/tests/sparse_compat.py" "$RUNNER_TEMP/libkodiairplay.so" "$RUNNER_TEMP/remux-tests/fixtures" "$RUNNER_TEMP/remux-tests/sparse-compat"
          # r48: upscaled copies (Lanczos engine here; the AI engine is the iPhone's): size, HEVC, every track kept,
          # HDR / same size refused, the setting used once, cancel mid-copy.
          python3 -B "$R/tests/upscale_host.py" "$RUNNER_TEMP/libkodiairplay.so" "$RUNNER_TEMP/remux-tests/upscale"
      - name: Retain synthetic fixture and dependency configuration on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AirPlay-host-diagnostics
          path: |
            ${{ runner.temp }}/remux-tests/fixtures/dovi.mkv
            ${{ runner.temp }}/ff-host/FFMPEG-CONFIG.txt
  host-evidence:
    permissions:
      contents: read
      actions: read
    if: inputs.inspect_only != true && github.event_name == 'workflow_dispatch' && inputs.reuse_host_run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify successful host job and identical native source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REUSED_RUN: ${{ inputs.reuse_host_run }}
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess
          repo,run=os.environ['REPO'],os.environ['REUSED_RUN']
          assert re.fullmatch(r'[0-9]+',run), 'Invalid run id'
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/'+repo+path]))
          data=api('/actions/runs/'+run)
          assert data['repository']['full_name']==repo
          assert data['path']=='.github/workflows/airplay-remux.yml'
          jobs=api('/actions/runs/'+run+'/jobs?per_page=100')['jobs']
          assert any(j['name']=='host-tests' and j['conclusion']=='success' for j in jobs), 'No successful host-tests job'
          source=data['head_sha']
          subprocess.run(['git','-c','credential.helper=!gh auth git-credential','fetch','--no-tags','--depth=1','origin',source],check=True)
          def tree(ref):
              return subprocess.check_output(['git','rev-parse',ref+':migration/airplay-ios']).strip()
          assert tree(source)==tree('HEAD'), 'AirPlay source differs from tested host source'
          print('Reused successful host tests from run',run,'with identical AirPlay tree',tree(source).decode())
          PY
  framework:
    needs: host-evidence
    if: ${{ inputs.inspect_only != true && !cancelled() && (needs.host-evidence.result == 'success' || needs.host-evidence.result == 'skipped') }}
    # macos-15 selects ARM64; capacity exhaustion canceled the candidate before it got a runner.
    # The Intel image also has Xcode 26; the framework remains cross-compiled for iPhone arm64.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile and fault-test the actual Foundation HTTP transport
        run: python3 -B scripts/test_native_http_transport.py
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/ff-ios
          key: remux-ffmpeg-ios-${{ hashFiles('migration/airplay-ios/build-remux-ffmpeg.sh', 'migration/airplay-ios/build-dav1d.sh', 'migration/airplay-ios/ffmpeg-mov-pts.patch', 'migration/airplay-ios/ffmpeg-dovi-padding.patch', 'migration/airplay-ios/ffmpeg-mkv-skip-attachments.patch') }}
      - name: FFmpeg 8.1.1 (remux + picture bridge, LGPL) for iPhoneOS
        run: |
          [ -f "$RUNNER_TEMP/ff-ios/lib/libavformat.a" ] || bash migration/airplay-ios/build-remux-ffmpeg.sh ios "$RUNNER_TEMP/ff-ios"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/ass-ios
          key: remux-libass-ios-${{ hashFiles('migration/airplay-ios/build-libass.sh') }}
      - name: libass (r10 burned-in subtitles) for iPhoneOS
        run: |
          [ -f "$RUNNER_TEMP/ass-ios/lib/libass.a" ] || bash migration/airplay-ios/build-libass.sh ios "$RUNNER_TEMP/ass-ios"
      - name: Compile KodiAirPlay.framework candidate with the remuxer
        env:
          REMUX_FFMPEG: ${{ runner.temp }}/ff-ios
          REMUX_LIBASS: ${{ runner.temp }}/ass-ios
        run: bash migration/airplay-ios/build-airplay.sh "$RUNNER_TEMP/airplay"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KodiAirPlay-source-candidate
          path: |
            ${{ runner.temp }}/airplay/KodiAirPlay.framework.zip
            ${{ runner.temp }}/airplay/KodiAirPlay.framework.zip.sha256
