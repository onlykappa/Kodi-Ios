name: Official iOS foundation inspection
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ios-foundation.yml'
      - 'scripts/inspect_ios_foundation.py'
      - 'scripts/test_ios_foundation.py'
permissions:
  contents: read
concurrency:
  group: kodi-ios-foundation
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test static parser
        run: python3 -B scripts/test_ios_foundation.py
      - name: Acquire official foundation without running package scripts
        run: |
          mkdir -p "$RUNNER_TEMP/kodi-foundation/out"
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 120 --output "$RUNNER_TEMP/kodi-foundation/foundation.deb" https://mirrors.kodi.tv/releases/darwin/ios-arm64/org.xbmc.kodi-ios_21.3_iphoneos-arm64.deb
          dpkg-deb --info "$RUNNER_TEMP/kodi-foundation/foundation.deb"
          dpkg-deb --extract "$RUNNER_TEMP/kodi-foundation/foundation.deb" "$RUNNER_TEMP/kodi-foundation/unpacked"
          test -d "$RUNNER_TEMP/kodi-foundation/unpacked/Applications/Kodi.app"
          python3 -B scripts/inspect_ios_foundation.py "$RUNNER_TEMP/kodi-foundation/unpacked/Applications/Kodi.app" --deb "$RUNNER_TEMP/kodi-foundation/foundation.deb" --report "$RUNNER_TEMP/kodi-foundation/out/foundation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-kodi-21.3-foundation-inspection
          path: ${{ runner.temp }}/kodi-foundation/out/foundation.json
          if-no-files-found: error
          retention-days: 7
