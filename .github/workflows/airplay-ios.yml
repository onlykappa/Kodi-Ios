name: AirPlay button for iPhoneOS
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/airplay-ios.yml'
      - 'migration/airplay-ios/build-airplay.sh'
      - 'migration/airplay-ios/source-lock.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: airplay-ios
  cancel-in-progress: false
jobs:
  airplay:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build KodiAirPlay.framework
        run: bash migration/airplay-ios/build-airplay.sh "$RUNNER_TEMP/airplay"
      # The IPA build fetches the framework from this release and checks the sha256 pinned in
      # migration/airplay-ios/source-lock.json; an existing tag is never replaced, so the pin stays valid.
      - name: Publish the framework once per tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tag="$(python3 -c "import json;print(json.load(open('migration/airplay-ios/source-lock.json'))['framework_release']['tag'])")"
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then echo "$tag already published"; exit 0; fi
          dir="$RUNNER_TEMP/airplay"
          gh release create "$tag" "$dir/KodiAirPlay.framework.zip" --repo "$REPO" --target "$SHA" --prerelease \
            --title "AirPlay button for iPhoneOS ($tag)" --notes "$(cat "$dir/KodiAirPlay.framework.zip.sha256")"
