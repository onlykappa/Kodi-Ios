name: Build Kodi iPhone executable
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/kodi-ios-portrait.yml'
      - 'migration/ios-portrait/build-kodi-ios.sh'
      - 'migration/ios-portrait/kodi-21.3-portrait.patch'
      - 'migration/ios-portrait/source-lock.json'
      - 'scripts/test_seek_release.py'
  # Since the merge to main (DEC-024) builds run on pushes to main; pull requests still build too.
  push:
    branches: [main]
    paths:
      - '.github/workflows/kodi-ios-portrait.yml'
      - 'migration/ios-portrait/build-kodi-ios.sh'
      - 'migration/ios-portrait/kodi-21.3-portrait.patch'
      - 'migration/ios-portrait/source-lock.json'
      - 'scripts/test_seek_release.py'
  workflow_dispatch:
permissions:
  contents: write
# A Kodi build takes hours: a new push waits for the running one instead of cancelling it.
concurrency:
  group: kodi-ios-portrait
  cancel-in-progress: false
jobs:
  # Pull requests run this workflow on every push once the patch is in the PR's changes (2026-11-13: a one-hour rebuild
  # of an already published r32 at each push). Skip the build when the release for build_tag exists and the patch is
  # the one locked (patch_sha256); a manual run always builds.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.need.outputs.build }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Is this build already published?
        id: need
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          tag="$(python3 -c "import json;d=json.load(open('migration/ios-portrait/source-lock.json'));print(d.get('build_tag') or d['executable_release']['tag'])")"
          locked="$(python3 -c "import json;print(json.load(open('migration/ios-portrait/source-lock.json')).get('patch_sha256',''))")"
          actual="$(sha256sum migration/ios-portrait/kodi-21.3-portrait.patch | cut -d' ' -f1)"
          if [ "$EVENT" != "workflow_dispatch" ] && [ "$locked" = "$actual" ] && gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "$tag is published from this patch; nothing to build"; echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
  executable:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # Kodi's depends take most of the build time; keep them (and their build stamps) even when a later step fails.
      - name: Restore built Kodi depends
        id: depends
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ${{ runner.temp }}/kodi-ios/depends
            ${{ runner.temp }}/kodi-ios/xbmc
          key: kodi-ios-depends-21.3-Omega-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build patched Kodi executable for iPhoneOS
        id: build
        run: bash migration/ios-portrait/build-kodi-ios.sh "$RUNNER_TEMP/kodi-ios" "$RUNNER_TEMP/kodi-ios-out"
      - name: Check whether depends finished
        id: built
        if: always()
        run: test -f "$RUNNER_TEMP/kodi-ios/depends/.depends-built" && echo "ok=true" >> "$GITHUB_OUTPUT" || true
      - name: Save built Kodi depends
        if: always() && steps.depends.outputs.cache-hit != 'true' && steps.built.outputs.ok == 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ${{ runner.temp }}/kodi-ios/depends
            ${{ runner.temp }}/kodi-ios/xbmc
          key: kodi-ios-depends-21.3-Omega-${{ runner.os }}-${{ runner.arch }}-v1
      # Keep the built executable even if publishing fails, so the publish job can be re-run alone.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kodi-ios-portrait-executable
          path: ${{ runner.temp }}/kodi-ios-out/*
          if-no-files-found: error
          retention-days: 30
  # Publishing runs as its own short job: a failed release call (HTTP 403 on r22) can be retried
  # with "Re-run failed jobs" in seconds instead of rebuilding Kodi on macOS.
  publish:
    needs: executable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: kodi-ios-portrait-executable
          path: ${{ runner.temp }}/kodi-ios-out
      # The IPA build fetches the executable from this release and checks the sha256 pinned in
      # migration/ios-portrait/source-lock.json; an existing tag is never replaced, so the pin stays valid.
      - name: Publish the executable once per tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tag="$(python3 -c "import json;d=json.load(open('migration/ios-portrait/source-lock.json'));print(d.get('build_tag') or d['executable_release']['tag'])")"
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then echo "$tag already published"; exit 0; fi
          dir="$RUNNER_TEMP/kodi-ios-out"
          (cd "$dir" && zip -q Kodi-portrait-executable.zip Kodi)
          gh release create "$tag" "$dir/Kodi-portrait-executable.zip" --repo "$REPO" --target "$SHA" --prerelease \
            --title "Kodi 21.3 iPhone executable with rotation ($tag)" --notes "$(cat "$dir/Kodi.sha256")"
